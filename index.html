<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prueba MindAR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>

<body>

    <a-scene
       mindar-image="imageTargetSrc: targets/TG_SOL1.mind;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- Recursos del ejemplo oficial -->
        <a-assets>

            <img
                id="card"
                src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png">

            <a-asset-item
                id="avatarModel"
                src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf">
            </a-asset-item>

        </a-assets>


        <!-- Cámara -->
        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>


        <!-- Target oficial -->
        <a-entity
            mindar-image-target="targetIndex: 0">

            <!-- Imagen del target -->
            <a-plane
                src="#card"
                position="0 0 0"
                height="0.552"
                width="1">
            </a-plane>

            <!-- Modelo 3D de prueba -->
            <a-gltf-model
                src="#avatarModel"
                position="0 0 0.1"
                scale="0.005 0.005 0.005">
            </a-gltf-model>

        </a-entity>

    </a-scene>

</body>

</html>
