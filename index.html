<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Museo Virtual del Sistema Solar</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>

<body>

    <a-scene
        mindar-image="imageTargetSrc: targets/TG_SOL1.mind;"
        embedded
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- Iluminación -->
        <a-light
            type="ambient"
            color="#ffffff"
            intensity="2">
        </a-light>


        <!-- Cámara -->
        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>


        <!-- TARGET DEL SOL -->
        <a-entity
            mindar-image-target="targetIndex: 0">

            <!-- Modelo 3D del Sol -->
            <a-entity
                gltf-model="url(modelos/sun1.glb)"
                position="0 0 0"
                scale="1 1 1">
            </a-entity>

        </a-entity>

    </a-scene>

</body>

</html>
