<!DOCTYPE html>
<html lang="es">

<head>

    <!--
        Define la codificación de caracteres.
        UTF-8 permite utilizar correctamente caracteres
        como á, é, í, ó, ñ, etc.
    -->
    <meta charset="UTF-8">

    <!--
        Hace que la página se adapte correctamente
        a la pantalla del teléfono.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--
        Título que aparecerá en la pestaña del navegador.
    -->
    <title>Museo Virtual del Sistema Solar</title>


    <!-- =========================================================
         A-FRAME
         =========================================================

         A-Frame es el framework que utilizamos para crear
         la escena 3D y mostrar nuestro modelo GLB.

         En este proyecto utilizamos la versión 1.5.0.
    -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


    <!-- =========================================================
         MINDAR
         =========================================================

         MindAR permite utilizar la cámara del teléfono para
         reconocer una imagen (TARGET) y colocar contenido
         de realidad aumentada sobre ella.

         La versión utilizada es la 1.2.5.
    -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>


<body>


    <!-- =========================================================
         ESCENA PRINCIPAL DE REALIDAD AUMENTADA
         =========================================================

         <a-scene> es el contenedor principal de A-Frame.

         Aquí configuramos MindAR y establecemos el archivo
         de targets que utilizará nuestra aplicación.
    -->

    <!--
        imageTargetSrc indica dónde se encuentra nuestro
        archivo de targets de MindAR.

        En nuestro proyecto:

        targets/
        └── TG_SOL3.mind

        Este archivo contiene la información necesaria
        para reconocer nuestra imagen objetivo.
        
        vr-mode-ui desactiva la interfaz de realidad virtual.

        device-orientation-permission-ui desactiva la interfaz
        relacionada con los permisos de orientación del dispositivo.
    -->

    <a-scene
        mindar-image="imageTargetSrc: targets/TG_SOL3.mind;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">


        <!-- =====================================================
             CÁMARA
             =====================================================

             Esta es la cámara utilizada por la escena de A-Frame.

             MindAR utiliza la cámara del teléfono para observar
             el mundo real y detectar nuestro TARGET.
        -->

        <!--
            position="0 0 0"

            Coloca la cámara en el origen de la escena.

            look-controls="enabled: false"

            Desactiva los controles manuales de la cámara.
            No queremos que el usuario controle la cámara
            como en un videojuego.
        -->

        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>


        <!-- =====================================================
             TARGET DE REALIDAD AUMENTADA
             =====================================================

             Este elemento establece qué contenido aparecerá
             cuando MindAR encuentre nuestro TARGET.

             targetIndex: 0 significa que utilizamos el primer
             target almacenado dentro de TG_SOL3.mind.
        -->

       <a-entity
    mindar-image-target="targetIndex: 0">

    <!-- =================================================
         MODELO 3D DEL SOL
         ================================================= -->

    <a-gltf-model
        src="modelos/sun1.glb"
        position="0 0 0"
        scale="1 1 1">
    </a-gltf-model>


    <!-- =================================================
         NOMBRE DEL OBJETO
         ================================================= -->

   <!-- Nombre del objeto -->
<a-text
    value="EL SOL"
    align="center"
    position="0 -0.6 0"
    color="#FFFFFF"
    width="2">
</a-text>


<!-- Tarjeta educativa -->
<a-plane
    position="0 -1.35 -0.05"
    width="3.0"
    height="1.35"
    color="#222222"
    opacity="0.9">
</a-plane>


<!-- Tipo de objeto -->
<a-text
    value="Nuestra estrella"
    align="center"
    position="0 -0.85 0"
    color="#FFFFFF"
    width="2.4">
</a-text>


<!-- Diámetro -->
<a-text
    value="Diámetro: 1,392,000 km"
    align="center"
    position="0 -1.08 0"
    color="#FFFFFF"
    width="2.2">
</a-text>


<!-- Temperatura -->
<a-text
    value="Temperatura superficial: ~5,500 °C"
    align="center"
    position="0 -1.30 0"
    color="#FFFFFF"
    width="2.0">
</a-text>


<!-- Comparación con la Tierra -->
<a-text
    value="~1.3 millones de Tierras"
    align="center"
    position="0 -1.52 0"
    color="#FFFFFF"
    width="2.2">
</a-text>


<!-- Aclaración de la comparación -->
<a-text
    value="por volumen"
    align="center"
    position="0 -1.70 0"
    color="#CCCCCC"
    width="1.6">
</a-text>
</a-entity>


    </a-scene>


</body>

</html>
